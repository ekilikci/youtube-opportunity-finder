[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-opportunity-finder"
version = "0.1.0"
description = "A Turkish-first YouTube opportunity data platform."
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2,<4",
]


[tool.setuptools.packages.find]
where = ["src"]